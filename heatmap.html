<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>전국 아파트 평당가 변동률 히트맵 | HerdVibe</title>
<meta property="og:title" content="전국 아파트 평당가 변동률 히트맵 | HerdVibe">
<meta property="og:description" content="시/구별 평당가 변동률을 한눈에 — 어디가 오르고 어디가 빠지나?">
<meta property="og:url" content="https://herdvibe.com/110">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.1/kakao.min.js" crossorigin="anonymous" async></script>
<style>
:root{--bg0:#0a0a0a;--bg1:#111111;--bg2:#1a1a1a;--bdr:#2a2a2a;--t1:#ffffff;--t2:#cccccc;--t3:#888888;--t4:#555555;--g:#00d4aa;--r:#ff4757}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg0);color:var(--t1);line-height:1.6;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg0)}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.mono{font-family:'JetBrains Mono',monospace}

.hdr{padding:12px 28px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;background:var(--bg1);position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.hdr-title{font-weight:700;font-size:18px;color:#fff}
.page{max-width:1200px;margin:0 auto;padding:20px 20px}
.sub-info{text-align:center;font-size:11px;color:var(--t4);margin-bottom:14px;font-family:'JetBrains Mono',monospace}

/* Sort controls */
.sort-bar{display:flex;justify-content:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.sort-btn{padding:5px 14px;border:1px solid var(--bdr);background:transparent;color:var(--t3);border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .15s}
.sort-btn:hover{border-color:var(--t4);color:var(--t1)}
.sort-btn.active{background:rgba(0,212,170,.15);border-color:var(--g);color:var(--g)}

/* Summary cards */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sum-card{background:var(--bg1);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;text-align:center}
.sum-card .lb{font-size:10px;color:var(--t4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sum-card .vl{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;line-height:1}

/* Heatmap table */
.heatmap-section{margin-bottom:16px}
.sido-group{margin-bottom:12px}
.sido-label{font-size:14px;font-weight:700;color:var(--t1);padding:10px 10px;border-bottom:1px solid var(--bdr);margin-bottom:0}
.hm-table{width:100%;border-collapse:collapse}
.hm-table th{padding:8px 10px;text-align:center;font-size:11px;font-weight:500;color:var(--t4);border-bottom:1px solid var(--bdr);font-family:'JetBrains Mono',monospace;cursor:pointer;user-select:none;white-space:nowrap}
.hm-table th:first-child{text-align:left;cursor:default;width:140px}
.hm-table th:hover:not(:first-child){color:var(--t1)}
.hm-table th.sorted{color:var(--g)}
.hm-table th .arrow{font-size:8px;margin-left:3px;opacity:0.5}
.hm-table th.sorted .arrow{opacity:1}
.hm-table td{padding:7px 10px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;border-bottom:1px solid rgba(42,42,42,0.4)}
.hm-table td:first-child{text-align:left;font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:13px;color:var(--t2)}
.hm-table tr:hover td{background:rgba(255,255,255,0.02)}
.hm-table td.cell{border-radius:4px;min-width:70px}

/* Share */
.share-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;margin-top:16px;background:var(--bg1);border:1px solid var(--bdr);border-radius:10px}
.share-bar-preview{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;font-family:'JetBrains Mono',monospace}
.share-bar-preview b{color:var(--t2);font-weight:600}
.share-bar-buttons{display:flex;align-items:center;gap:6px;flex-shrink:0}
.share-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--bdr);background:var(--bg1);color:var(--t3);white-space:nowrap;font-family:inherit}
.share-btn:hover{transform:translateY(-1px);color:var(--t1)}
.share-btn svg{flex-shrink:0}
.share-btn--x:hover{border-color:#fff;color:#fff}
.share-btn--kakao:hover{border-color:#FEE500;color:#191919;background:#FEE500}
.share-btn--tg:hover{border-color:#26A5E4;color:#fff;background:rgba(38,165,228,.15)}
.share-btn--ig:hover{border-color:#E4405F;color:#fff;background:rgba(228,64,95,.15)}
.share-btn--copy:hover{border-color:var(--g);color:var(--g);background:rgba(0,212,170,.07)}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:999}
.toast{background:var(--bg2);border:1px solid var(--bdr);border-left:3px solid var(--g);border-radius:8px;padding:10px 18px;font-size:12px;color:var(--t1);box-shadow:0 8px 32px rgba(0,0,0,.7);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--t4);gap:14px}
.spinner{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:16px 0;font-size:10px;color:var(--t4)}

/* No data */
.no-data{color:var(--t4);font-size:11px;font-style:italic}

@media(max-width:768px){
.page{padding:12px 12px}.hdr{padding:8px 16px}.hdr-title{font-size:15px}
.summary{grid-template-columns:repeat(2,1fr)}
.sum-card .vl{font-size:16px}
.hm-table td,.hm-table th{padding:5px 6px;font-size:11px}
.hm-table td:first-child{font-size:12px}
.hm-table td.cell{min-width:54px}
.share-bar{flex-direction:column;gap:10px;align-items:stretch}
.share-bar-preview{max-width:100%}
.share-bar-buttons{justify-content:center;flex-wrap:wrap}
.share-btn .lbl{display:none}.share-btn{padding:8px 10px}
}
@media(max-width:480px){
.hm-table td:first-child{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>
</head>
<body>
<div class="hdr"><span class="hdr-title">전국 아파트 평당가 변동률</span></div>
<div class="page">
<div class="sub-info" id="updateInfo">데이터 로딩 중...</div>

<div class="sort-bar">
<button class="sort-btn" data-col="1m" onclick="setSort('1m')">1M</button>
<button class="sort-btn active" data-col="3m" onclick="setSort('3m')">3M</button>
<button class="sort-btn" data-col="6m" onclick="setSort('6m')">6M</button>
<button class="sort-btn" data-col="1y" onclick="setSort('1y')">1Y</button>
</div>

<div class="summary">
<div class="sum-card"><div class="lb">상승 지역</div><div class="vl" id="sUp" style="color:var(--g)">—</div></div>
<div class="sum-card"><div class="lb">하락 지역</div><div class="vl" id="sDown" style="color:var(--r)">—</div></div>
<div class="sum-card"><div class="lb">최대 상승</div><div class="vl" id="sTopName" style="color:var(--g);font-size:13px">—</div></div>
<div class="sum-card"><div class="lb">최대 하락</div><div class="vl" id="sBotName" style="color:var(--r);font-size:13px">—</div></div>
</div>

<div id="loadingEl" class="loading"><div class="spinner"></div><div>데이터를 불러오는 중...</div></div>
<div id="heatmapEl" style="display:none;"></div>

<div id="shareBarWrap"></div>
<div class="footer" id="footerText">데이터 출처: 국토교통부 실거래가 공개시스템 · <span style="color:var(--t2)">HerdVibe</span></div>
</div>

<script>
var SHARE_URL='https://herdvibe.com/110';
var KAKAO_KEY='a43ed7b39fac35458f4f9df925a279b5';
var DATA_URL='./data/district_top10.json';

var SIDO_ORDER=["서울시","경기도","인천시","부산시","대구시","광주시","대전시","울산시","세종시","강원도","충북","충남","전북","전남","경북","경남","제주도"];
var SIDO_SHORT={"서울시":"서울","인천시":"인천","부산시":"부산","대구시":"대구","광주시":"광주","대전시":"대전","울산시":"울산","세종시":"세종","경기도":"경기","강원도":"강원","충북":"충북","충남":"충남","전북":"전북","전남":"전남","경북":"경북","경남":"경남","제주도":"제주"};

var allRows=[], currentSort='3m', sortDir='desc';

/* ── Color ── */
function chgColor(v){
    if(v==null)return{bg:'transparent',fg:'var(--t4)'};
    var a=Math.min(Math.abs(v)/15,1);
    if(v>0){
        var r=Math.round(10+a*10),g=Math.round(30+a*180),b=Math.round(20+a*80);
        return{bg:'rgba('+r+','+g+','+b+','+(0.15+a*0.55)+')',fg:a>0.3?'#fff':'#ccc'};
    }else{
        var r2=Math.round(50+a*200),g2=Math.round(20+a*20),b2=Math.round(30+a*40);
        return{bg:'rgba('+r2+','+g2+','+b2+','+(0.15+a*0.55)+')',fg:a>0.3?'#fff':'#ccc'};
    }
}

function fmtChg(v){
    if(v==null)return'—';
    return(v>=0?'+':'')+v.toFixed(1)+'%';
}

/* ── Parse Data ── */
function parseData(json){
    var labels=json.labels||[];
    var data=json.data||{};
    var rows=[];

    for(var key in data){
        if(key.indexOf('_city_')>=0)continue; // skip city aggregates
        var parts=key.split('|');
        if(parts.length!==2)continue;
        var sido=parts[0],gu=parts[1];
        var d=data[key];
        if(!d||!d.series||!d.series.length)continue;

        // Average all 10 series to get district-level trend
        var len=labels.length;
        var avg=new Array(len).fill(null);
        var cnt=new Array(len).fill(0);
        for(var s=0;s<d.series.length;s++){
            var ser=d.series[s];
            for(var m=0;m<len&&m<ser.length;m++){
                if(ser[m]!=null){avg[m]=(avg[m]||0)+ser[m];cnt[m]++;}
            }
        }
        for(var m=0;m<len;m++){avg[m]=cnt[m]>0?avg[m]/cnt[m]:null;}

        // Find latest non-null
        var latest=null,latIdx=-1;
        for(var m=len-1;m>=0;m--){if(avg[m]!=null){latest=avg[m];latIdx=m;break;}}
        if(latest==null)continue;

        // Calc changes
        function getChg(months){
            var idx=latIdx-months;
            if(idx<0||avg[idx]==null)return null;
            return(latest-avg[idx])/avg[idx]*100;
        }

        rows.push({
            sido:sido, gu:gu, avg_ppyeong:d.avg, deals:d.deals,
            chg1m:getChg(1), chg3m:getChg(3), chg6m:getChg(6), chg1y:getChg(12),
            latest:latest
        });
    }
    return rows;
}

/* ── Render ── */
function updateSummary(){
    var col='chg'+currentSort.replace('m','m').replace('y','y');
    // fix col name
    if(currentSort==='1m')col='chg1m';
    if(currentSort==='3m')col='chg3m';
    if(currentSort==='6m')col='chg6m';
    if(currentSort==='1y')col='chg1y';

    var up=0,down=0,topRow=null,botRow=null;
    allRows.forEach(function(r){
        var v=r[col];
        if(v==null)return;
        if(v>0)up++;
        if(v<0)down++;
        if(!topRow||v>(topRow[col]||0))topRow=r;
        if(!botRow||v<(botRow[col]||0))botRow=r;
    });
    document.getElementById('sUp').textContent=up+'개';
    document.getElementById('sDown').textContent=down+'개';
    if(topRow){
        document.getElementById('sTopName').textContent=topRow.gu+' '+fmtChg(topRow['chg'+currentSort.replace('m','m')]);
        document.getElementById('sTopName').innerHTML=topRow.gu+' <span class="mono" style="font-size:11px">'+fmtChg(topRow[col])+'</span>';
    }
    if(botRow){
        document.getElementById('sBotName').innerHTML=botRow.gu+' <span class="mono" style="font-size:11px">'+fmtChg(botRow[col])+'</span>';
    }
}

function render(){
    var col;
    if(currentSort==='1m')col='chg1m';
    else if(currentSort==='3m')col='chg3m';
    else if(currentSort==='6m')col='chg6m';
    else col='chg1y';

    updateSummary();

    // Group by sido
    var groups={};
    SIDO_ORDER.forEach(function(s){groups[s]=[];});
    allRows.forEach(function(r){
        if(!groups[r.sido])groups[r.sido]=[];
        groups[r.sido].push(r);
    });

    // Sort within each group
    for(var s in groups){
        groups[s].sort(function(a,b){
            var va=a[col],vb=b[col];
            if(va==null&&vb==null)return 0;
            if(va==null)return 1;
            if(vb==null)return-1;
            return sortDir==='desc'?vb-va:va-vb;
        });
    }

    var html='';
    SIDO_ORDER.forEach(function(sido){
        var rows=groups[sido];
        if(!rows||!rows.length)return;

        html+='<div class="sido-group">';
        html+='<div class="sido-label">'+(SIDO_SHORT[sido]||sido)+' <span style="color:var(--t3);font-weight:400;font-size:12px">('+rows.length+'개 지역)</span></div>';
        html+='<table class="hm-table"><thead><tr>';
        html+='<th>지역</th>';
        html+='<th class="'+(currentSort==='1m'?'sorted':'')+'" onclick="setSort(\'1m\')">1M<span class="arrow">▼</span></th>';
        html+='<th class="'+(currentSort==='3m'?'sorted':'')+'" onclick="setSort(\'3m\')">3M<span class="arrow">▼</span></th>';
        html+='<th class="'+(currentSort==='6m'?'sorted':'')+'" onclick="setSort(\'6m\')">6M<span class="arrow">▼</span></th>';
        html+='<th class="'+(currentSort==='1y'?'sorted':'')+'" onclick="setSort(\'1y\')">1Y<span class="arrow">▼</span></th>';
        html+='</tr></thead><tbody>';

        rows.forEach(function(r){
            var c1=chgColor(r.chg1m),c3=chgColor(r.chg3m),c6=chgColor(r.chg6m),cy=chgColor(r.chg1y);
            html+='<tr>';
            html+='<td>'+r.gu+'</td>';
            html+='<td class="cell" style="background:'+c1.bg+';color:'+c1.fg+'">'+fmtChg(r.chg1m)+'</td>';
            html+='<td class="cell" style="background:'+c3.bg+';color:'+c3.fg+'">'+fmtChg(r.chg3m)+'</td>';
            html+='<td class="cell" style="background:'+c6.bg+';color:'+c6.fg+'">'+fmtChg(r.chg6m)+'</td>';
            html+='<td class="cell" style="background:'+cy.bg+';color:'+cy.fg+'">'+fmtChg(r.chg1y)+'</td>';
            html+='</tr>';
        });

        html+='</tbody></table></div>';
    });

    document.getElementById('heatmapEl').innerHTML=html;
}

function setSort(col){
    if(currentSort===col){sortDir=sortDir==='desc'?'asc':'desc';}
    else{currentSort=col;sortDir='desc';}
    document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.toggle('active',b.dataset.col===col);});
    render();
}

/* ── Init ── */
async function init(){
    try{
        var resp=await fetch(DATA_URL);
        if(!resp.ok)throw new Error('HTTP '+resp.status);
        var json=await resp.json();

        allRows=parseData(json);
        document.getElementById('updateInfo').textContent='마지막: '+(json.updated||'—')+' · TOP 10 평균 기준 · '+allRows.length+'개 지역';

        document.getElementById('loadingEl').style.display='none';
        document.getElementById('heatmapEl').style.display='block';
        render();
    }catch(e){
        document.getElementById('loadingEl').innerHTML='<div style="color:var(--r);text-align:center;padding:40px;">❌ '+e.message+'<br><small>district_top10.json 필요</small></div>';
    }
}

init();

/* ── Share ── */
function ensureKakao(){try{if(typeof Kakao!=='undefined'&&!Kakao.isInitialized())Kakao.init(KAKAO_KEY);return typeof Kakao!=='undefined'&&Kakao.isInitialized();}catch(e){return false;}}
function copyToClipboard(t){if(window.parent!==window){window.parent.postMessage({type:'copy',text:t},'*')}if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){navigator.clipboard.writeText(t).catch(function(){_fbCopy(t)})}else{_fbCopy(t)}}function _fbCopy(t){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a)}
function flashCopied(btn){if(!btn)return;var orig=btn.innerHTML;btn.style.background='#22c55e';btn.style.color='#fff';btn.style.borderColor='#22c55e';btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>';setTimeout(function(){btn.style.background='';btn.style.color='';btn.style.borderColor='';btn.innerHTML=orig;},2000);}
function kakaoShare(title){if(!ensureKakao()){copyToClipboard(SHARE_URL);showToast('링크 복사완료!');return;}try{Kakao.Share.sendDefault({objectType:'feed',content:{title:title||document.title,description:'시/구별 평당가 변동률 히트맵',imageUrl:'',link:{mobileWebUrl:SHARE_URL,webUrl:SHARE_URL}},buttons:[{title:'대시보드 보기',link:{mobileWebUrl:SHARE_URL,webUrl:SHARE_URL}}]});}catch(e){copyToClipboard(SHARE_URL);showToast('링크 복사완료!');}}
function showToast(msg){var w=document.querySelector('.toast-wrap');if(!w){w=document.createElement('div');w.className='toast-wrap';document.body.appendChild(w);}var t=document.createElement('div');t.className='toast';t.textContent=msg;w.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateY(12px)';t.style.transition='.3s';setTimeout(function(){t.remove();},300);},3000);}
function doShare(p,btn){var title='전국 아파트 평당가 변동률 히트맵 — herdvibe.com';switch(p){case'twitter':window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(title)+'&url='+encodeURIComponent(SHARE_URL),'_blank');break;case'telegram':window.open('https://t.me/share/url?url='+encodeURIComponent(SHARE_URL)+'&text='+encodeURIComponent(title),'_blank');break;case'kakao':kakaoShare(title);break;case'instagram':copyToClipboard(SHARE_URL);flashCopied(btn);showToast('링크 복사완료! 인스타그램에 붙여넣기 하세요');break;case'link':copyToClipboard(SHARE_URL);flashCopied(btn);showToast('링크가 복사되었습니다');break;}}
